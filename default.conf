
server {
    #El servidor escuchará en el puerto 80
    listen 80;
    #El servidor responderá a cualquier nombre de host
    server_name _;
    #La ubicación raíz del servidor será la carpeta /usr/share/nginx/html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    #La ubicación /api/ se redirigirá al servidor backend en http://
    location /api/ {
        proxy_pass http://10.0.143.90:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}